# User-owned PufferDrive puffer_drive env config overlay
# This file is merged on top of pufferlib config/default.ini + pufferlib/config/ocean/drive.ini
# Keep this as the single place to edit Puffer env defaults without CLI collisions

# ===== pufferl.load_config argparse-layer defaults =====
render_mode: auto  # choices: auto, human, ansi, rgb_array, raylib, None
save_frames: 0
fps: 15

# # ===== pufferlib/config/default.ini defaults =====
# # [base]
# package: None
# env_name: None
# policy_name: Policy
# rnn_name: None
# max_suggestion_cost: 3600

# # [vec]
# backend: Multiprocessing
# num_envs: 2
# num_workers: auto
# batch_size: auto
# zero_copy: True
# seed: 42

# ===== pufferlib/config/ocean/drive.ini defaults =====
# [base]
package: ocean
env_name: puffer_drive

# [vec]
vec:
  num_workers: 16
  num_envs: 16
  batch_size: 4
  backend: Multiprocessing
  # backend: Serial
  zero_copy: True
  seed: 42

# [env]
env: 
  num_agents: 1024
  action_type: discrete # Options: discrete, continuous
  dynamics_model: classic # Options: classic, jerk, delta
  reward_vehicle_collision: -0.5
  reward_offroad_collision: -0.5
  dt: 0.1
  reward_goal: 1.0
  reward_goal_post_respawn: 0.25
  goal_radius: 2.0 # Meters around goal to be considered "reached"
  goal_speed: 100.0 # Max target speed in m/s for the agent to maintain towards the goal
  goal_behavior: 0 # What to do when the goal is reached. Options: 0:"respawn", 1:"generate_new_goals", 2:"stop"
  goal_target_distance: 30.0
      # Determines the target distance to the new goal in the case of goal_behavior = generate_new_goals.
      # Large numbers will select a goal point further away from the agent's current position.
  collision_behavior: 0 # Options: 0 - Ignore, 1 - Stop, 2 - Remove
  offroad_behavior: 0 # Options: 0 - Ignore, 1 - Stop, 2 - Remove
  episode_length: 91 # Number of steps before termination
  resample_frequency: 910
  termination_mode: 1 # 0 - terminate at episode_length, 1 - terminate after all agents have been reset
  map_dir: "resources/drive/binaries/training"
  num_maps: 10000
  init_steps: 0 # Determines which step of the trajectory to initialize the agents at upon reset
  control_mode: "control_agents" # Options: "control_vehicles", "control_agents", "control_wosac", "control_sdc_only", "control_mixed_play"
  init_mode: "create_all_valid" # Options: "created_all_valid", "create_only_controlled"
  max_controlled_agents: 32 # Sets the maximum number of controllable agents per scene, ONLY used if control_mode is "control_mixed_play"
  render_mode: 1 
  # Render mode options:
      # 0:"window" = pop-up raylib window (original)
      # 1:"headless" = off-screen; frames piped to ffmpeg (recommended for training)
